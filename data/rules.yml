#MINITESTS
- rule: pedir minitest
  steps:
    - intent: pedir_minitest
    - action: action_pedir_tema_minitest



- rule: responder minitest con a
  condition:
    - slot_was_set:
        - minitest_activo: en_curso
  steps:
    - intent: respuesta_a
    - action: action_procesar_respuesta_minitest

- rule: responder minitest con b
  condition:
    - slot_was_set:
        - minitest_activo: en_curso
  steps:
    - intent: respuesta_b
    - action: action_procesar_respuesta_minitest

- rule: responder minitest con c
  condition:
    - slot_was_set:
        - minitest_activo: en_curso
  steps:
    - intent: respuesta_c
    - action: action_procesar_respuesta_minitest

- rule: Respuesta invalida durante minitest
  condition:
    - slot_was_set:
        - minitest_activo: "en_curso"
  steps:
    - intent: respuesta_invalida_minitest
    - action: action_respuesta_invalida_minitest

- rule: fallback dentro de minitest
  condition:
    - slot_was_set:
        - minitest_activo: en_curso
  steps:
    - intent: nlu_fallback
    - action: action_respuesta_invalida_minitest



