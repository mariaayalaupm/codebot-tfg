  utter_ask_campos_struct:
    - text: "Un campo de un struct es cada una de las variables que contiene. Por ejemplo: struct Persona {{ int edad; char nombre[20]; }}; tiene dos campos: edad y nombre."

  utter_ask_diferencia_acceso_struct:
    - text: "El operador . se usa cuando tienes la variable struct directamente (p.edad). El operador -> se usa cuando tienes un puntero a struct (p->edad)."

  utter_ask_ejemplo_struct:
    - text: "Ejemplo: struct Persona {{ int edad; char nombre[20]; }}; Luego puedes usar: struct Persona p; p.edad = 20;"


